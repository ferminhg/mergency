services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MERGENCY_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./scripts:/app/scripts
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    restart: unless-stopped
    command: celery -A mergency.worker.celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      MERGENCY_REDIS_URL: redis://redis:6379/0
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mergency
      POSTGRES_PASSWORD: mergency
      POSTGRES_DB: mergency
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mergency"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
