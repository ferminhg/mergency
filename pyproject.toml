[project]
name = "mergency"
version = "0.1.0"
description = "Error budget bot for pull requests"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic-settings>=2.5",
    "pygithub>=2.4",
    "celery>=5.4",
    "uvicorn[standard]>=0.32",
    "pyyaml>=6.0",
    "codeowners>=0.9",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = [
    # FastAPI's dependency injection relies on calling Depends()/Header() as
    # an argument default; this is the framework's documented pattern, not a bug.
    "B008",
    # Line length is enforced by the formatter, not the linter; descriptive
    # test names shouldn't be penalized for going over the limit.
    "E501",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mergency"]
